<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Registration</title>


    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================
           PAGE BACKGROUND
        ========================== */

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(
                135deg,
                #4f8df7 0%,
                #6d5dfc 50%,
                #8d4de8 100%
            );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 15px;

            position: relative;

            overflow-x: hidden;
        }


        /* Decorative circles */

        body::before {

            content: "";

            position: fixed;

            width: 230px;

            height: 230px;

            background: rgba(255,255,255,0.12);

            border-radius: 50%;

            top: -90px;

            left: -80px;

        }


        body::after {

            content: "";

            position: fixed;

            width: 280px;

            height: 280px;

            background: rgba(255,255,255,0.10);

            border-radius: 50%;

            bottom: -120px;

            right: -90px;

        }


        /* =========================
           MAIN CARD
        ========================== */

        .container {

            width: 100%;

            max-width: 720px;

            background: rgba(255,255,255,0.98);

            border-radius: 25px;

            padding: 40px 45px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.25);

            position: relative;

            z-index: 2;
        }


        /* =========================
           HEADER
        ========================== */

        .header {

            text-align: center;

            margin-bottom: 30px;
        }


        /* Calendar icon */

        .event-icon {

            width: 85px;

            height: 70px;

            margin: 0 auto 18px;

            border: 5px solid #6366f1;

            border-radius: 12px;

            position: relative;

            display: flex;

            justify-content: center;

            align-items: center;

            background: white;

            box-shadow:
                0 8px 20px rgba(99,102,241,0.18);
        }


        .event-icon::before,
        .event-icon::after {

            content: "";

            position: absolute;

            width: 12px;

            height: 18px;

            background: white;

            border: 5px solid #6366f1;

            border-radius: 6px;

            top: -15px;
        }


        .event-icon::before {

            left: 16px;
        }


        .event-icon::after {

            right: 16px;
        }


        .person-icon {

            font-size: 30px;
        }


        h1 {

            margin: 0;

            font-size: 38px;

            font-weight: 800;

            background: linear-gradient(
                90deg,
                #2563eb,
                #7c3aed
            );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        .subtitle {

            margin-top: 10px;

            color: #64748b;

            font-size: 16px;
        }


        /* =========================
           FORM
        ========================== */

        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: flex;

            align-items: center;

            gap: 9px;

            margin-bottom: 8px;

            font-size: 16px;

            font-weight: 700;

            color: #172554;
        }


        .label-icon {

            width: 25px;

            font-size: 21px;

            text-align: center;
        }


        input,
        select {

            width: 100%;

            padding: 14px 16px;

            border-radius: 11px;

            border: 2px solid #dbeafe;

            background: #ffffff;

            color: #1e293b;

            font-size: 15px;

            transition: all 0.25s ease;
        }


        input::placeholder {

            color: #8da0bd;
        }


        input:focus,
        select:focus {

            outline: none;

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px rgba(99,102,241,0.12);
        }


        /* Two columns */

        .row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }


        /* =========================
           SUBMIT BUTTON
        ========================== */

        .submit-btn {

            width: 100%;

            margin-top: 12px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                90deg,
                #1683f7,
                #9145e8
            );

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(91,83,245,0.30);

            transition: all 0.25s ease;
        }


        .submit-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(91,83,245,0.40);
        }


        .submit-btn:active {

            transform: translateY(0);
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            body {

                padding: 20px 12px;
            }


            .container {

                padding: 28px 20px;

                border-radius: 20px;
            }


            h1 {

                font-size: 29px;
            }


            .subtitle {

                font-size: 14px;
            }


            .row {

                grid-template-columns: 1fr;

                gap: 0;
            }


            input,
            select {

                padding: 13px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="event-icon">

            <span class="person-icon">
                👤
            </span>

        </div>


        <h1>
            Event Registration
        </h1>


        <div class="subtitle">

            Register for the event by filling in your details

        </div>

    </div>



    <!-- =========================
         REGISTRATION FORM
    ========================== -->

 
    <iframe name="hiddenFrame" style="display:none;"></iframe>

    <form id="registrationForm" method="POST" action="https://script.google.com/macros/s/AKfycbyWPFCxH-DL2Ls8K28vniuMQNmj0o3WBgozCmJlcB4mYKTrMdtpf6E2hWMQRj9uoSQT/exec" target="hiddenFrame">


        <!-- EVENT NAME -->

        <div class="form-group">

            <label>

                <span class="label-icon">
                    📅
                </span>

                Event Name

            </label>


            <input
                type="text"
                id="eventName"
                name="eventName"
                placeholder="Enter event name"
                required
            >

        </div>



        <!-- NAME -->

        <div class="form-group">

            <label>

                <span class="label-icon">
                    👤
                </span>

                Name

            </label>


            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your full name"
                required
            >

        </div>



        <!-- ROLL NUMBER -->

        <div class="form-group">

            <label>

                <span class="label-icon">
                    🪪
                </span>

                Roll No

            </label>


            <input
                type="text"
                id="rollNo"
                name="rollNo"
                placeholder="Enter roll number"
                required
            >

        </div>



        <!-- YEAR + DEPARTMENT -->

        <div class="row">


            <div class="form-group">

                <label>

                    <span class="label-icon">
                        🎓
                    </span>

                    Year

                </label>


                <select id="year" name="year" required>

                    <option value="">
                        Select Year
                    </option>

                    <option>
                        1st Year
                    </option>

                    <option>
                        2nd Year
                    </option>

                    <option>
                        3rd Year
                    </option>

                    <option>
                        4th Year
                    </option>

                </select>

            </div>



            <div class="form-group">

                <label>

                    <span class="label-icon">
                        🏫
                    </span>

                    Department

                </label>


                <input
                    type="text"
                    id="department"
 		    name="department"
                    placeholder="Enter department"
                    required
                >

            </div>

        </div>



        <!-- SECTION + NUMBER OF STUDENTS -->

        <div class="row">


            <div class="form-group">

                <label>

                    <span class="label-icon">
                        👥
                    </span>

                    Section

                </label>


                <input
                    type="text"
                    id="section"
		    name="section"
                    placeholder="Enter section"
                    required
                >

            </div>



            <div class="form-group">

                <label>

                    <span class="label-icon">
                        👨‍👩‍👧
                    </span>

                    No. of Students

                </label>


                <input
                    type="number"
                    id="students"
		    name="students"
                    min="1"
                    placeholder="Enter number"
                    required
                >

            </div>

        </div>



        <!-- MOBILE NUMBER -->

        <div class="form-group">

            <label>

                <span class="label-icon">
                    📱
                </span>

                Mobile Number

            </label>


            <input
                type="tel"
                id="mobile"
		name="mobile"
                maxlength="10"
                placeholder="Enter 10-digit mobile number"
                pattern="[0-9]{10}"
                required
            >

        </div>



        <!-- EMAIL -->

        <div class="form-group">

            <label>

                <span class="label-icon">
                    ✉️
                </span>

                Email ID

            </label>


            <input
                type="email"
                id="email"
		name="email"
                placeholder="Enter your email address"
                required
            >

        </div>



        <!-- SUBMIT -->

        <button
            type="submit"
            class="submit-btn"
        >

            ✈️ &nbsp; Submit Registration 🚀

        </button>


    </form>


</div>



<script>

    document
    .getElementById("registrationForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        let mobile =
            document.getElementById("mobile").value;


        /* Check mobile number */

        if (!/^[0-9]{10}$/.test(mobile)) {

            alert(
                "Please enter a valid 10-digit mobile number."
            );

            return;

        }


        /* Open success page */

        document.getElementById("registrationForm").submit();

setTimeout(function() {
    window.location.href = "success.html";
}, 1000);

    });

</script>


</body>

</html>

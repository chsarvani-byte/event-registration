<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Event Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f8df7, #6d5dfc, #8d4de8);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        .icon {
            text-align: center;
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #6d5dfc;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f8df7, #6d5dfc);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6d5dfc;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            color: red;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="icon">👩‍🎓</div>

        <h1>Student Login</h1>

        <p class="subtitle">
            Login to register for an event
        </p>

        <form id="studentLogin">

            <label>Email ID</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

            <p id="message" class="message"></p>

        </form>

        <a href="login.html" class="back">
            ← Back to Login Selection
        </a>

    </div>

    <script>
        document.getElementById("studentLogin").addEventListener("submit", function(event) {

            event.preventDefault();

            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            if (email === "student@gmail.com" && password === "student123") {

                window.location.href = "index.html";

            } else {

                document.getElementById("message").innerText =
                    "Invalid email or password.";

            }

        });
    </script>

</body>
</html>
